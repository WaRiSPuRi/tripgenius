<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TripGenius — Offline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#f0f0f8;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
.container{max-width:400px}
.icon{font-size:4rem;margin-bottom:1.5rem}
h1{font-family:Georgia,serif;font-size:1.8rem;font-weight:600;margin-bottom:1rem;letter-spacing:-0.02em}
h1 span{color:#7b6ef6}
p{font-size:14px;color:#8888aa;line-height:1.7;margin-bottom:2rem}
.retry-btn{padding:13px 28px;background:#7b6ef6;border:none;border-radius:12px;font-size:14px;font-weight:500;color:#fff;cursor:pointer}
.retry-btn:hover{background:#6a5de0}
.tips{margin-top:2rem;background:#12121a;border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:1.25rem;text-align:left}
.tips-title{font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:#5eead4;margin-bottom:10px}
.tip{font-size:13px;color:#8888aa;margin-bottom:6px;padding-left:16px;position:relative}
.tip::before{content:'•';position:absolute;left:0;color:#7b6ef6}
</style>
</head>
<body>
<div class="container">
  <div class="icon">✈️</div>
  <h1>Trip<span>Genius</span></h1>
  <p>You are currently offline. Connect to the internet to plan your next trip and access real-time AI recommendations.</p>
  <button class="retry-btn" onclick="window.location.reload()">Try again</button>
  <div class="tips">
    <div class="tips-title">While you wait</div>
    <div class="tip">Review your saved itineraries in the app</div>
    <div class="tip">Check your downloaded PDF itineraries</div>
    <div class="tip">Connect to WiFi or mobile data to continue</div>
  </div>
</div>
</body>
</html>
